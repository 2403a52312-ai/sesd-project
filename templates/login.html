{% extends "base.html" %}
{% block title %}Login | JobGuard AI{% endblock %}
{% block content %}
<section class="auth-layout">
  <div class="auth-aside"><span class="eyebrow">WELCOME BACK</span><h1>Your safer search starts here.</h1><p>Sign in to analyse opportunities and review your scan history.</p></div>
  <form class="form-card" method="POST">
    <h2>Login to JobGuard</h2><p class="muted">Enter your account details.</p>
    <label>Email address</label><input type="email" name="email" placeholder="you@example.com" required>
    <label>Password</label><input type="password" name="password" placeholder="Your password" required>
    <button class="btn btn-primary full" type="submit">Login →</button>
    <p class="form-bottom">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
  </form>
</section>
{% endblock %}
